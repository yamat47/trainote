<!-- @dsCard group="Navigation" height=72 subtitle="Four icon tabs, Notes selected" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="phone"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(T.TabBar, { active: "notes", items: [
      { key: "notes", label: "Notes", icon: "doc_text", iconActive: "doc_text_fill" },
      { key: "weight", label: "Weight", icon: "chart_bar", iconActive: "chart_bar_fill" },
      { key: "coach", label: "Coach", icon: "bubble_left_bubble_right", iconActive: "bubble_left_bubble_right_fill" },
      { key: "profile", label: "Profile", icon: "person_crop_circle", iconActive: "person_crop_circle_fill" }
    ] })
  );
</script>
</body>
</html>
