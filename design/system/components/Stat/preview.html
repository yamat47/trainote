<!-- @dsCard group="Numbers" height=96 subtitle="The weekly tally and today" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="pad" style="gap:16px"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h(T.Stat, { value: "9", label: "wins" }),
      h(T.Stat, { value: "2", label: "slips" }),
      h(T.Stat, { value: "5", unit: "days", label: "streak" }),
      h(T.Stat, { value: "64.2", unit: "kg", label: "today" })
    )
  );
</script>
</body>
</html>
