<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="phone" style="background:var(--grouped-background)"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(T.Group, { header: "Goal", footer: "Claude reads these before every reply." },
      h(T.Field, { label: "Goal weight", numeric: true, unit: "kg", defaultValue: "60.0" }),
      h(T.Row, { detail: "Mar 31, 2027", accessory: "disclosure", onClick: function () {} }, "Target date"),
      h(T.Row, { detail: "Gym" }, "Where you train")
    )
  );
</script>
</body>
</html>
