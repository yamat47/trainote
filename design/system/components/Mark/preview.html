<!-- @dsCard group="Lists" height=56 subtitle="Win and Slip" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="pad" style="font-size:13px;line-height:18px;color:var(--secondary-label)"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h("span", { style: { display: "inline-flex", gap: "4px", alignItems: "center", marginRight: "16px" } }, h(T.Mark, { kind: "win" }), "Win"),
      h("span", { style: { display: "inline-flex", gap: "4px", alignItems: "center" } }, h(T.Mark, { kind: "slip" }), "Slip")
    )
  );
</script>
</body>
</html>
