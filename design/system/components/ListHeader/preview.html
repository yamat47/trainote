<!doctype html>
<html>
<head><meta charset="utf-8"><title>ListHeader — preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}</style>
</head>
<body>
<div id="root" class="phone"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h(T.ListHeader, null, "Yesterday"),
      h(T.Row, { kind: "win" }, "23 時に寝た"),
      h(T.Row, { kind: "slip" }, "ジムをサボった")
    )
  );
</script>
</body>
</html>
