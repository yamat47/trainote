<!-- @dsCard group="Lists" height=276 subtitle="A Win with numbers, a Win, a Slip, a navigable row, an action row" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="phone"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h(T.Row, { mark: h(T.Mark, { kind: "win" }), sub: "60 kg × 10 × 3" }, "ベンチプレス"),
      h(T.Row, { mark: h(T.Mark, { kind: "win" }) }, "お菓子を我慢した"),
      h(T.Row, { mark: h(T.Mark, { kind: "slip" }), muted: true }, "夜更かしした"),
      h(T.Row, { detail: "64.2 kg" }, "Sun, Oct 26"),
      h(T.Row, { accessory: "disclosure", onClick: function () {} }, "Weekly review"),
      h(T.Row, { tone: "tint", accessory: "disclosure", onClick: function () {} }, "Show all entries")
    )
  );
</script>
</body>
</html>
