<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--system-background);font-family:var(--font-sans)}.phone{width:390px}.pad{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root" class="pad"></div>
<script>
  var T = window.Trainote, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h(T.Button, { variant: "prominent" }, "Save"),
      h(T.Button, { variant: "tinted" }, "Start weekly review"),
      h(T.Button, { variant: "plain" }, "Edit"),
      h(T.Button, { variant: "plain", bold: true }, "Done"),
      h(T.Button, { variant: "destructive" }, "Delete")
    )
  );
</script>
</body>
</html>
