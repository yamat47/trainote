<!-- @dsCard group="Actions" subtitle="Prominent, Plain, Destructive, Disabled" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>#root { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; }</style>
</head>
<body>
<div id="root"></div>
<script>
var T = window.Trainote, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h(T.Button, { "onClick": function () {}, "variant": "prominent" }, "Save 3 entries"),
    h(T.Button, { "onClick": function () {}, "variant": "plain" }, "Edit text"),
    h(T.Button, { "onClick": function () {}, "variant": "destructive" }, "Delete"),
    h(T.Button, { "onClick": function () {}, "variant": "prominent", "disabled": true }, "Save 3 entries")
  )
);
</script>
</body>
</html>
