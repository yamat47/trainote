<div id="root"></div>
<script>

    h(T.Row, { "kind": "win" }, "お菓子を我慢した"),

    h(T.Row, { "detail": "64.2 kg" }, "Sun, Oct 26"),

    h(T.Row, { "tone": "tint", "accessory": "disclosure", "onClick": function () {} }, "Show all entries"),
    h(T.Row, { "tone": "tint", "onClick": function () {}, "error": "Could not change the reminder. Try again." }, "Turn on the Sunday reminder")
  )
