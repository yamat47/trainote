<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weight, all entries</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/trainote/tokens.css">
<link rel="stylesheet" href="ds/trainote/components/bundle.css">
<script src="ds/trainote/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--tint)}

</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--system-background); color: var(--label); font-family: var(--font-sans)">
  <div style="height: 54px; flex: none"></div>
  <header style="position: relative; display: flex; align-items: center; justify-content: center; height: 44px; flex: none; border-bottom: 0.5px solid var(--separator)">
    <a href="Weight.dc.html" style="position: absolute; left: 8px; top: 0; height: 44px; display: inline-flex; align-items: center; gap: 2px; padding: 0 4px; text-decoration: none; font-size: 17px; line-height: 22px; color: var(--tint)"><i class="f7-icons" aria-hidden="true" style="font-size: 22px">chevron_left</i>Weight</a>
    <span style="font-size: 17px; line-height: 22px; font-weight: 600">All entries</span>
  </header>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <x-import component-from-global-scope="Trainote.ListHeader">October</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.2 kg" sub="Body fat 18.4 %">Sunday, Oct 25</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.4 kg">Saturday, Oct 24</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.6 kg" sub="Body fat 18.6 %">Friday, Oct 23</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.5 kg">Thursday, Oct 22</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.9 kg">Wednesday, Oct 21</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.8 kg" sub="Body fat 18.9 %">Tuesday, Oct 20</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="65.0 kg">Monday, Oct 19</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="65.2 kg">Sunday, Oct 18</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="65.1 kg">Saturday, Oct 17</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="65.4 kg" sub="Body fat 19.0 %">Friday, Oct 16</x-import>
  </div>
  <div style="flex: none; padding-bottom: 34px; background: var(--system-background)">
    <x-import component-from-global-scope="Trainote.TabBar" items="{{tabs}}" active="weight"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      two: 2,
      tabs: [
        { key: 'notes', label: 'Notes', icon: 'doc_text', iconActive: 'doc_text_fill' },
        { key: 'weight', label: 'Weight', icon: 'chart_bar', iconActive: 'chart_bar_fill' },
        { key: 'coach', label: 'Coach', icon: 'bubble_left_bubble_right', iconActive: 'bubble_left_bubble_right_fill' },
        { key: 'profile', label: 'Profile', icon: 'person_crop_circle', iconActive: 'person_crop_circle_fill' }
      ],
      periods: [{ key: 'w', label: 'W' }, { key: 'm', label: 'M' }, { key: '6m', label: '6M' }, { key: 'y', label: 'Y' }],
      week: [
        { label: 'Mon' }, { label: 'Tue', wins: 1 }, { label: 'Wed', wins: 1 }, { label: 'Thu', wins: 1 },
        { label: 'Fri', wins: 2 }, { label: 'Sat', wins: 2, slips: 1 }, { label: 'Sun', wins: 2, slips: 1, today: true }
      ]
    };
  }
}
</script>
</body>
</html>
