<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekly review thread</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/trainote/tokens.css">
<link rel="stylesheet" href="ds/trainote/components/bundle.css">
<script src="ds/trainote/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007aff}a:hover{color:#0a84ff}

</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--system-background); color: var(--label); font-family: var(--font-sans)">
  <div style="height: 54px; flex: none"></div>
  <header style="position: relative; display: flex; align-items: center; justify-content: center; height: 44px; flex: none; border-bottom: 0.5px solid var(--separator)">
    <a href="Coach.dc.html" style="position: absolute; left: 8px; top: 0; height: 44px; display: inline-flex; align-items: center; gap: 2px; padding: 0 4px; text-decoration: none; font-size: 17px; line-height: 22px; color: var(--tint)"><i class="f7-icons" aria-hidden="true" style="font-size: 22px">chevron_left</i>Coach</a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 17px; line-height: 22px; font-weight: 600">Weekly review</span>
      <span style="font-size: 11px; line-height: 13px; color: var(--secondary-label)">Sunday, Oct 26</span>
    </div>
  </header>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-top: 8px">
    <p style="margin: 0; padding: 8px 16px; text-align: center; font-size: 11px; line-height: 13px; color: var(--secondary-label)">Today 20:02</p>
    <x-import component-from-global-scope="Trainote.Bubble" from="me">今週の振り返りをして</x-import>
    <p style="margin: 0; padding: 6px 16px 8px; font-size: 12px; line-height: 16px; color: var(--secondary-label)">Reading your notes</p>
    <x-import component-from-global-scope="Trainote.Bubble" from="coach">今週は Win が 9 件、Slip が 2 件でした。運動 3 回、食事の Win が 4 件と、食事が安定しています。

体重は 64.8 kg から 64.2 kg へ。目標の 60.0 kg まであと 4.2 kg です。

Slip は 2 つとも睡眠でした。来週の方針は 1 つだけ。平日は 23 時に寝る日を 3 日つくりましょう。</x-import>
  </div>
  <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 0.5px solid var(--separator); background: var(--system-background)">
    <label for="reply" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
    <input id="reply" type="text" placeholder="Message" style="flex: 1; box-sizing: border-box; height: 36px; margin: 0; padding: 0 14px; border: 0.5px solid var(--separator); border-radius: 18px; background: var(--system-background); font-family: var(--font-sans); font-size: 17px; color: var(--label)">
    <button type="button" aria-label="Send" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: 0; padding: 0; border: 0; background: none; color: var(--tint); cursor: pointer"><i class="f7-icons" aria-hidden="true" style="font-size: 32px">arrow_up_circle_fill</i></button>
  </div>
  <div style="height: 34px; flex: none; background: var(--system-background)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      two: 2,
      tabs: [
        { key: 'notes', label: 'Notes', icon: 'doc_text', iconActive: 'doc_text_fill' },
        { key: 'weight', label: 'Weight', icon: 'chart_bar', iconActive: 'chart_bar_fill' },
        { key: 'coach', label: 'Coach', icon: 'bubble_left_bubble_right', iconActive: 'bubble_left_bubble_right_fill' },
        { key: 'profile', label: 'Profile', icon: 'person_crop_circle', iconActive: 'person_crop_circle_fill' }
      ],
      periods: [{ key: 'w', label: 'W' }, { key: 'm', label: 'M' }, { key: '6m', label: '6M' }, { key: 'y', label: 'Y' }],
      week: [
        { label: 'Mon' }, { label: 'Tue', wins: 1 }, { label: 'Wed', wins: 1 }, { label: 'Thu', wins: 1 },
        { label: 'Fri', wins: 2 }, { label: 'Sat', wins: 2, slips: 1 }, { label: 'Sun', wins: 2, slips: 1, today: true }
      ]
    };
  }
}
</script>
</body>
</html>
