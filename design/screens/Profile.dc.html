<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/trainote/tokens.css">
<link rel="stylesheet" href="ds/trainote/components/bundle.css">
<script src="ds/trainote/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--tint)}
.tn-navbar{background:var(--grouped-background)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--grouped-background); color: var(--label); font-family: var(--font-sans)">
  <div style="height: 54px; flex: none"></div>
  <x-import component-from-global-scope="Trainote.NavBar" title="Profile"></x-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <x-import component-from-global-scope="Trainote.Group" header="About you">
      <x-import component-from-global-scope="Trainote.Field" label="Height" numeric="{{yes}}" unit="cm" default-value="172"></x-import>
      <x-import component-from-global-scope="Trainote.Field" label="Born" numeric="{{yes}}" default-value="1990"></x-import>
      <x-import component-from-global-scope="Trainote.Row" detail="Male" accessory="disclosure">Sex</x-import>
    </x-import>
    <x-import component-from-global-scope="Trainote.Group" header="Goal">
      <x-import component-from-global-scope="Trainote.Field" label="Goal weight" numeric="{{yes}}" unit="kg" default-value="60.0"></x-import>
      <x-import component-from-global-scope="Trainote.Row" detail="Mar 31, 2027" accessory="disclosure">Target date</x-import>
    </x-import>
    <x-import component-from-global-scope="Trainote.Group" header="Training">
      <x-import component-from-global-scope="Trainote.Row" detail="Gym" accessory="disclosure">Where</x-import>
      <x-import component-from-global-scope="Trainote.Field" label="Days a week" numeric="{{yes}}" default-value="3"></x-import>
      <x-import component-from-global-scope="Trainote.Row" detail="バーベル、ダンベル、ケーブル" accessory="disclosure">Equipment</x-import>
    </x-import>
    <x-import component-from-global-scope="Trainote.Group" header="Notes for your coach" footer="Your coach reads everything on this screen before every reply.">
      <x-import component-from-global-scope="Trainote.Field" multiline="{{yes}}" rows="{{two}}" default-value="膝が弱いので深いスクワットは避ける。平日は 21 時以降に食べがち。" aria-label="Notes for your coach"></x-import>
    </x-import>
  </div>
  <div style="flex: none; padding-bottom: 34px; background: var(--system-background)">
    <x-import component-from-global-scope="Trainote.TabBar" items="{{tabs}}" active="profile"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      two: 2,
      tabs: [
        { key: 'notes', label: 'Notes', icon: 'doc_text', iconActive: 'doc_text_fill' },
        { key: 'weight', label: 'Weight', icon: 'chart_bar', iconActive: 'chart_bar_fill' },
        { key: 'coach', label: 'Coach', icon: 'bubble_left_bubble_right', iconActive: 'bubble_left_bubble_right_fill' },
        { key: 'profile', label: 'Profile', icon: 'person_crop_circle', iconActive: 'person_crop_circle_fill' }
      ],
      periods: [{ key: 'w', label: 'W' }, { key: 'm', label: 'M' }, { key: '6m', label: '6M' }, { key: 'y', label: 'Y' }],
      week: [
        { label: 'Mon' }, { label: 'Tue', wins: 1 }, { label: 'Wed', wins: 1 }, { label: 'Thu', wins: 1 },
        { label: 'Fri', wins: 2 }, { label: 'Sat', wins: 2, slips: 1 }, { label: 'Sun', wins: 2, slips: 1, today: true }
      ]
    };
  }
}
</script>
</body>
</html>
