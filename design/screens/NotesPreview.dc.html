<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes, preview of a new entry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/trainote/tokens.css">
<link rel="stylesheet" href="ds/trainote/components/bundle.css">
<script src="ds/trainote/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--tint)}

</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--system-background); color: var(--label); font-family: var(--font-sans)">
  <div style="height: 54px; flex: none"></div>
  <x-import component-from-global-scope="Trainote.NavBar" title="Notes"><x-import component-from-global-scope="Trainote.Button" variant="plain">Filter</x-import></x-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <x-import component-from-global-scope="Trainote.Week" days="{{week}}"></x-import>
    <p style="margin: 0; padding: 6px 16px 10px; font-size: 13px; line-height: 18px; color: var(--secondary-label)">9 wins and 2 slips this week, 6 days in a row.</p>
    <x-import component-from-global-scope="Trainote.Field" multiline="{{yes}}" rows="{{two}}" default-value="ベンチ60kg10回3セット、お菓子我慢した、夜更かしした" aria-label="New entry"></x-import>
    <x-import component-from-global-scope="Trainote.ListHeader">Read as 3 entries</x-import>
    <div style="margin: 4px 16px 0; border-radius: 10px; background: var(--secondary-background); overflow: hidden">
      <x-import component-from-global-scope="Trainote.Row" kind="win" detail="Exercise" sub="ベンチプレス 60 kg × 10 × 3">ベンチプレス</x-import>
      <x-import component-from-global-scope="Trainote.Row" kind="win" detail="Food">お菓子を我慢した</x-import>
      <x-import component-from-global-scope="Trainote.Row" kind="slip" detail="Sleep">夜更かしした</x-import>
    </div>
    <p style="margin: 0; padding: 12px 16px 0; font-size: 15px; line-height: 20px; color: var(--secondary-label)">お菓子を我慢できたのは大きいです。</p>
    <div style="display: flex; gap: 8px; align-items: center; padding: 16px 16px 0">
      <x-import component-from-global-scope="Trainote.Button" variant="plain">Edit text</x-import>
      <div style="flex: 1; display: flex"><x-import component-from-global-scope="Trainote.Button" variant="prominent" block="{{yes}}">Save 3 entries</x-import></div>
    </div>
    <x-import component-from-global-scope="Trainote.ListHeader">Today</x-import>
    <x-import component-from-global-scope="Trainote.Row" kind="win">昼をサラダにした</x-import>
  </div>
  <div style="flex: none; padding-bottom: 34px; background: var(--system-background)">
    <x-import component-from-global-scope="Trainote.TabBar" items="{{tabs}}" active="notes"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      two: 2,
      tabs: [
        { key: 'notes', label: 'Notes', icon: 'doc_text', iconActive: 'doc_text_fill' },
        { key: 'weight', label: 'Weight', icon: 'chart_bar', iconActive: 'chart_bar_fill' },
        { key: 'coach', label: 'Coach', icon: 'bubble_left_bubble_right', iconActive: 'bubble_left_bubble_right_fill' },
        { key: 'profile', label: 'Profile', icon: 'person_crop_circle', iconActive: 'person_crop_circle_fill' }
      ],
      periods: [{ key: 'w', label: 'W' }, { key: 'm', label: 'M' }, { key: '6m', label: '6M' }, { key: 'y', label: 'Y' }],
      week: [
        { label: 'Mon' }, { label: 'Tue', wins: 1 }, { label: 'Wed', wins: 1 }, { label: 'Thu', wins: 1 },
        { label: 'Fri', wins: 2 }, { label: 'Sat', wins: 2, slips: 1 }, { label: 'Sun', wins: 2, slips: 1, today: true }
      ]
    };
  }
}
</script>
</body>
</html>
