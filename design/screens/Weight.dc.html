<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weight</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/trainote/tokens.css">
<link rel="stylesheet" href="ds/trainote/components/bundle.css">
<script src="ds/trainote/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007aff}a:hover{color:#0a84ff}

</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--system-background); color: var(--label); font-family: var(--font-sans)">
  <div style="height: 54px; flex: none"></div>
  <x-import component-from-global-scope="Trainote.NavBar" title="Weight"></x-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <x-import component-from-global-scope="Trainote.Field" label="Today" numeric="{{yes}}" unit="kg" placeholder="0.0" aria-label="Weight today"></x-import>
    <div style="padding: 16px 16px 12px"><x-import component-from-global-scope="Trainote.Segmented" items="{{periods}}" value="m" label="Period"></x-import></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 4px">
      <x-import component-from-global-scope="Trainote.Stat" value="64.2" unit="kg" label="Sunday, Oct 26"></x-import>
      <span style="font-size: 15px; line-height: 20px; color: var(--secondary-label)">−0.6 kg this week</span>
    </div>
    <figure style="margin: 0; padding: 8px 16px 0">
      <svg viewBox="0 0 358 236" width="358" height="236" role="img" aria-label="Weight over the last month, falling from 65.2 to 64.2 kilograms, with the goal of 60 drawn as a dashed line">
        <g style="stroke: var(--separator); stroke-width: 0.5">
          <line x1="0" y1="20" x2="322" y2="20"></line>
          <line x1="0" y1="70" x2="322" y2="70"></line>
          <line x1="0" y1="120" x2="322" y2="120"></line>
          <line x1="0" y1="170" x2="322" y2="170"></line>
          <line x1="0" y1="220" x2="322" y2="220"></line>
        </g>
        <g style="fill: var(--secondary-label); font-family: var(--font-sans); font-size: 11px; font-variant-numeric: tabular-nums">
          <text x="330" y="24">66</text>
          <text x="330" y="74">64</text>
          <text x="330" y="124">62</text>
          <text x="330" y="174">60</text>
          <text x="330" y="224">58</text>
          <text x="0" y="235">Sep 28</text>
          <text x="161" y="235" text-anchor="middle">Oct 12</text>
          <text x="322" y="235" text-anchor="end">Oct 26</text>
        </g>
        <line x1="0" y1="170" x2="322" y2="170" style="stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 5"></line>
        <text x="322" y="164" text-anchor="end" style="fill: var(--red); font-family: var(--font-sans); font-size: 11px">Goal 60.0</text>
        <polyline fill="none" style="stroke: var(--tint); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round" points="0,40 23,42.5 46,37.5 69,45 92,47.5 115,42.5 138,47.5 161,50 184,52.5 207,47.5 230,55 253,57.5 276,52.5 299,57.5 322,65"></polyline>
        <circle cx="322" cy="65" r="4.5" style="fill: var(--tint); stroke: var(--system-background); stroke-width: 2"></circle>
      </svg>
    </figure>
    <p style="margin: 0; padding: 4px 16px 8px; font-size: 13px; line-height: 18px; color: var(--secondary-label)">Goal 60.0 kg by Mar 31, 2027. 4.2 kg to go.</p>
    <div style="height: 8px; flex: none"></div>
    <x-import component-from-global-scope="Trainote.Row" detail="64.2 kg">Today</x-import>
    <x-import component-from-global-scope="Trainote.Row" detail="64.4 kg">Yesterday</x-import>
    <x-import component-from-global-scope="Trainote.Row" tone="tint" accessory="disclosure">Show all entries</x-import>
  </div>
  <div style="flex: none; padding-bottom: 34px; background: var(--system-background)">
    <x-import component-from-global-scope="Trainote.TabBar" items="{{tabs}}" active="weight"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      two: 2,
      tabs: [
        { key: 'notes', label: 'Notes', icon: 'doc_text', iconActive: 'doc_text_fill' },
        { key: 'weight', label: 'Weight', icon: 'chart_bar', iconActive: 'chart_bar_fill' },
        { key: 'coach', label: 'Coach', icon: 'bubble_left_bubble_right', iconActive: 'bubble_left_bubble_right_fill' },
        { key: 'profile', label: 'Profile', icon: 'person_crop_circle', iconActive: 'person_crop_circle_fill' }
      ],
      periods: [{ key: 'w', label: 'W' }, { key: 'm', label: 'M' }, { key: '6m', label: '6M' }, { key: 'y', label: 'Y' }],
      week: [
        { label: 'Mon' }, { label: 'Tue', wins: 1 }, { label: 'Wed', wins: 1 }, { label: 'Thu', wins: 1 },
        { label: 'Fri', wins: 2 }, { label: 'Sat', wins: 2, slips: 1 }, { label: 'Sun', wins: 2, slips: 1, today: true }
      ]
    };
  }
}
</script>
</body>
</html>
