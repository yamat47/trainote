# Keeps the skills under .claude/skills/ (installed with
# `gh skill install yamat47/github-toolkit <name>`) at the latest release of
# their source repository. The pull request it opens is reviewed with the
# review-skill-update skill. @main, not a tag: github-toolkit's README asks for it.
name: Update skills

on:
  schedule:
    - cron: '17 20 * * 0' # Mondays 05:17 JST
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: write # pushes the update-skills branch
      pull-requests: write # opens the pull request
    uses: yamat47/github-toolkit/.github/workflows/update-skills.yml@main
