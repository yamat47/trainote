# Keeps the app on the latest releases. A release waits seven days before it is
# proposed, so a compromised package has time to be caught by others first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive as one pull request; a major bump gets its own.
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The icon font's version is a design decision: design/system/fonts/ carries the
      # same file, and the two move together by hand.
      - dependency-name: framework7-icons
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
